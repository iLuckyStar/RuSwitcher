name: windows-build

# Builds and tests the native Windows version (x64 and ARM64) on a real Windows runner.
on:
  push:
    branches: [wip/windows, windows-port, main]
    paths:
      - 'windows/native/**'
      - 'scripts/check_windows_binary_size.ps1'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'windows/native/**'
      - 'scripts/check_windows_binary_size.ps1'
  workflow_dispatch:

jobs:
  build-native:
    runs-on: windows-latest
    strategy:
      matrix:
        architecture: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Configure native target (${{ matrix.architecture }})
        run: cmake -S windows/native -B build/native-${{ matrix.architecture }} -A ${{ matrix.architecture }}

      - name: Build native target (${{ matrix.architecture }})
        run: cmake --build build/native-${{ matrix.architecture }} --config Release

      - name: Run native unit tests (x64)
        if: matrix.architecture == 'x64'
        run: build/native-${{ matrix.architecture }}/Release/RuSwitcherNativeTests.exe

      - name: Enforce executable size budget
        shell: pwsh
        run: >
          pwsh -NoProfile -ExecutionPolicy Bypass
          -File scripts/check_windows_binary_size.ps1
          build/native-${{ matrix.architecture }}/Release/RuSwitcher.exe -MaximumMiB 5

      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: RuSwitcher-${{ matrix.architecture }}
          path: build/native-${{ matrix.architecture }}/Release/RuSwitcher.exe
          if-no-files-found: error
